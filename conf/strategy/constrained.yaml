_name_: ally

# basic setting
max_rds: 5
epsilon: 2.25 # set epsilon to 1000 for unconstrained learning
dual_lr: 0.1
dual_lr_gamma: 0.9
dual_lr_stepsize: 500
alpha: 0.01
slack_lr: 0.01
n_clusters: 128
n_steps: 8000
n_iters: 4
swap: False

# lambdanet training
val_size: 0.2 
max_epochs: 40 
per_device_batch_size_lambdanet: 512
per_device_batch_size_kmeans: 512
per_device_batch_size_emb: 1024
optimizer_lr: 1e-4
print_every: 1
resume: True # whether to resume from the model in previous round or not
patience: 6
scaler: min-max
scale_lr_factor: 2

# embedding pooling
pooling_method: mean
write_to_hard_drive: True
has_emb: False
shard_size: 1_000_000

# save intermediate res for debugging
save_intermediates: False