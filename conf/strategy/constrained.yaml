_name_: ally

# basic setting
max_rds: 5
n_iter: 1 # number of times to repeat n_steps of training before lambdanet training + loader update
epsilon: 2.25 # set epsilon to 1000 for unconstrained learning
nonparametric_epsilon: True # if True, replace scalar epsilon with a per-length-bin threshold refit each round from the previous round's own real losses (see LengthBinnedEpsilon)
epsilon_n_bins: 50 # number of length quantile bins for nonparametric_epsilon
epsilon_min_count: 50 # empirical-Bayes shrinkage pseudo-count toward the round mean for sparse length bins
dual_lr: 0.1
dual_lr_gamma: 0.9
dual_lr_stepsize: 500
n_clusters: 128
n_steps: 8000

# lambdanet training
val_size: 0.2 
max_epochs: 40 
batch_size_lambdanet: 512
batch_size_kmeans: 512
batch_size_emb: 1024
optimizer_lr: 1e-4
print_every: 1
reset_lambdanet: False # if False, load lambdanet from previous round's checkpoint instead of resetting weights
lambdanet_init_method: null # weight init for lambdanet's Linear layers at construction; null = pytorch default, or "kaiming"/"xavier"
patience: 6
scale_lr_factor: 2

# embedding pooling
pooling_method: mean

# save intermediate res for debugging
save_intermediates: False