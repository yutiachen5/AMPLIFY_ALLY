_name_: ally

# basic setting
max_rds: 5
epsilon: 2.25 # set epsilon to 1000 for unconstrained learning
dual_lr: 0.1
dual_lr_gamma: 0.9
dual_lr_stepsize: 500
n_clusters: 128
n_steps: 8000

# lambdanet training
val_size: 0.2 
max_epochs: 40 
batch_size_lambdanet: 512
batch_size_kmeans: 512
batch_size_emb: 1024
optimizer_lr: 1e-4
print_every: 1
reset_lambdanet: False # if False, load lambdanet from previous round's checkpoint instead of resetting weights
lambdanet_init_method: null # weight init for lambdanet's Linear layers at construction; null = pytorch default, or "kaiming"/"xavier"
patience: 6
scale_lr_factor: 2
lambdanet_grad_clip: 1.0 # max grad norm for LambdaNet's own optimizer step; set null/0 to disable

# embedding pooling
pooling_method: mean

# save intermediate res for debugging
save_intermediates: False