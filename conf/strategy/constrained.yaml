_name_: ally

# basic setting
max_rds: 5
epsilon: 2.25 # set epsilon to 1000 for unconstrained learning
dual_lr: 0.1
dual_lr_gamma: 0.9
dual_lr_stepsize: 500
n_clusters: 128
n_steps: 8000

# lambdanet training
val_size: 0.2 
max_epochs: 40 
per_device_batch_size_lambdanet: 512
per_device_batch_size_kmeans: 512
per_device_batch_size_emb: 1024
optimizer_lr: 1e-4
print_every: 1
patience: 6

# embedding pooling
pooling_method: mean