_name_: SpanMasking

train:
  max_length: 512
  padding: max_length
  pad_to_multiple_of: 8
  random_truncate: True
  mask_probability: 0.15
  span_probability: 0
  span_max: 1
  num_workers: 4
  batch_size: 16
  shuffle: True
  label_smoothing: 0
  weights: null #{L: 1.5, A: 1, G: 1, ...}
  exclude_special_tokens_replacement: False

validation:
  max_length: 512
  padding: max_length
  pad_to_multiple_of: 8
  random_truncate: True
  mask_probability: 0.15
  span_probability: 0
  span_max: 1
  num_workers: 4
  batch_size: 64
  freeze_mask: True # freeze masking (seeded from cfg.seed) so the same tokens are masked every eval, every round, every run
  label_smoothing: 0
  weights: null #{L: 1.5, A: 1, G: 1, ...}
  exclude_special_tokens_replacement: False